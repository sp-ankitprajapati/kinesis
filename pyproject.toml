[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinesis-path-tracking"
version = "0.1.0"
description = "Validated simulated path tracking with Pure Pursuit and SAC"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["kinesis*"]
